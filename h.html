<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


    <style>
        div.container{
            width: 400px; height: 500px;
         border: 2px solid black ;
        position: relative;
        overflow: hidden;
        
        }
        #bt{
            width: 220px;height: 100px;
            font-size: 1.5em; /* 1.5 times the parent's font size */

            background-color:steelblue ;
            position: relative;
            color: white;
            font-weight: bolder;
            border-radius: 18%;
            padding: 10px 20px;
      position: absolute;
      left: 20%;
      top: 40%;

        }
        #bt:hover{
            background-color:lightsteelblue ;
            color: white;
            font-weight: bolder;
        }
    </style>
</head>
<body>
    


<div class="container">
        <button id="bt">Click Me To Show You Same Action</button>

</div>

</body>
</html>
